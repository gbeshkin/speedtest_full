name: Health Monitor

on:
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir requests

      - name: Run health checks
        env:
          HEALTH_CHECKS_PER_RUN: "5"
          HEALTH_CHECK_INTERVAL_SECONDS: "60"
        run: |
          python healthcheck.py
          ls -la reports
          test -f reports/health.html
          test -f reports/health-history.jsonl

      - name: Publish health report to Pages (/docs)
        run: |
          mkdir -p docs
          cp reports/health.html docs/health.html
          touch docs/.nojekyll
          ls -la docs

      - name: Commit & push health report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs reports
          git diff --staged --quiet || git commit -m "auto: update health report"
          git pull --rebase
          git push
